[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bibliometrics"
version = "0.1.0"
description = "Compute h-index, g-index, i10-index and citation summaries from a publications CSV."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
bibliometrics = "bibliometrics.cli:main"

[tool.setuptools]
packages = ["bibliometrics"]
